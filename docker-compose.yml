version: '3.8'

services:
  backend:
    build: ./backend
    container_name: loan-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/db_data/loan_portal.db
    volumes:
      - db_data:/app/db_data
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: loan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  backend_logs:
